<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#56351f">
<title>بوم‌گردی مهران</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3ec;color:#35271e;font-family:Tahoma,Arial,sans-serif}
header{background:#56351f;color:white;padding:22px 18px;border-radius:0 0 24px 24px}
header h1{margin:0 0 8px;font-size:23px}
header p{margin:0;color:#ead8c3;font-size:12px}
main{padding:18px;max-width:850px;margin:auto}
.card{background:white;border-radius:17px;padding:17px;margin-bottom:15px;box-shadow:0 3px 15px #43250b0b}
h2{font-size:17px;margin:0 0 15px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#f5eee5;padding:15px;border-radius:13px}
.stat strong{display:block;font-size:25px;color:#86542e;margin-top:8px}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.room{border:1px solid #eee2d5;border-radius:13px;padding:13px}
.room b{display:block;margin-bottom:9px}
.room small{color:#806d5d}
button{border:0;border-radius:10px;background:#80502e;color:white;padding:13px 17px;font-size:14px;cursor:pointer}
button.secondary{background:#eee5da;color:#54351f}
input,select,textarea{width:100%;padding:13px;border:1px solid #ddd1c3;border-radius:10px;margin:7px 0 13px;font-family:inherit;font-size:14px;background:white}
label{font-size:12px;color:#685747}
form button{width:100%}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.nav button{flex:1;min-width:100px}
.reservation{border-bottom:1px solid #eee;padding:13px 0;font-size:13px}
.muted{color:#887969;font-size:12px}
.hidden{display:none!important}
#message{font-size:13px;color:#9b3b25;margin-top:10px}
@media(max-width:400px){.rooms{grid-template-columns:1fr}}
.jalali-overlay{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:99999;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.jalali-modal{
 background:white;
 width:100%;
 max-width:430px;
 border-radius:20px;
 padding:20px;
 box-shadow:0 10px 40px #0003;
}
.jalali-title{
 font-size:18px;
 font-weight:bold;
 margin-bottom:20px;
}
.jalali-wheels{
 display:flex;
 direction:rtl;
 gap:8px;
}
.wheel-wrap{
 flex:1;
 min-width:0;
 text-align:center;
}
.wheel-wrap small{
 display:block;
 margin-bottom:10px;
 color:#806d5d;
}
.wheel{
 height:220px;
 overflow-y:auto;
 scroll-snap-type:y mandatory;
 scrollbar-width:none;
 border-top:1px solid #ddd1c3;
 border-bottom:1px solid #ddd1c3;
}
.wheel::-webkit-scrollbar{
 display:none;
}
.wheel-spacer{
 height:88px;
}
.wheel-item{
 display:block;
 width:100%;
 height:44px;
 padding:0;
 border-radius:0;
 background:white;
 color:#806d5d;
 scroll-snap-align:center;
 font-size:16px;
}
.wheel-item.active{
 background:#f5eee5;
 color:#80502e;
 font-weight:bold;
}
.picker-actions{
 display:flex;
 gap:10px;
 margin-top:20px;
}
.picker-actions button{
 flex:1;
}
#pickerError{
 color:#b43b2b;
 font-size:12px;
 margin-top:10px;
}
</style>
</head>
<body>

<header>
<h1>بوم‌گردی مهران</h1>
<p>سامانه مدیریت اقامت و رزرو اتاق‌ها</p>
</header>

<main>
<section id="login" class="card">
<h2>ورود مدیر مجموعه</h2>
<label>ایمیل مدیر</label>
<input id="email" type="email" placeholder="ایمیل حساب مدیر">
<label>رمز عبور</label>
<input id="password" type="password" placeholder="رمز عبور">
<button onclick="login()">ورود به پنل مدیریت</button>
<div id="message"></div>
</section>

<section id="dashboard" class="hidden">
<div class="nav">
<button onclick="showTab('home')">داشبورد</button>
<button onclick="showTab('rooms')">اتاق‌ها</button>
<button onclick="showTab('booking')">رزرو جدید</button>
<button onclick="showTab('list')">رزروها</button>
<button class="secondary" onclick="logout()">خروج</button>
</div>

<div id="home">
<div class="card">
<h2>خوش آمدید 👋</h2>
<p class="muted">مدیریت بوم‌گردی مهران</p>
<div class="stats">
<div class="stat">تعداد اتاق‌ها<strong>۹</strong></div>
<div class="stat">رزروهای ثبت‌شده<strong id="total">۰</strong></div>
</div>
</div>
<div class="card">
<h2>آخرین رزروها</h2>
<div id="recent" class="muted">در حال دریافت اطلاعات...</div>
</div>
</div>

<div id="rooms" class="hidden">
<div class="card">
<h2>اتاق‌های مجموعه</h2>
<div id="roomList" class="rooms"></div>
</div>
</div>

<div id="booking" class="hidden">
<div class="card">
<h2>ثبت رزرو جدید</h2>
<form id="bookingForm">
<label>نام و نام خانوادگی مهمان</label>
<input id="guestName" required placeholder="نام مهمان">
<label>شماره موبایل</label>
<input id="phone" required inputmode="tel" placeholder="09xxxxxxxxx">
<label>انتخاب اتاق</label>
<select id="roomSelect" required></select>
<label>تاریخ ورود</label>
<input id="checkinDisplay" type="text" placeholder="انتخاب تاریخ ورود" readonly onclick="openJalaliPicker('checkin')">
<input id="checkin" type="hidden" required>
<label>تاریخ خروج</label>
<input id="checkoutDisplay" type="text" placeholder="انتخاب تاریخ خروج" readonly onclick="openJalaliPicker('checkout')">
<input id="checkout" type="hidden" required>
<label>تعداد بزرگسال</label>
<input id="adults" type="number" min="1" value="1" required>
<label>تعداد کودک</label>
<input id="children" type="number" min="0" value="0">
<label>تعداد نوزاد</label>
<input id="infants" type="number" min="0" value="0">
<label>مبلغ کل (تومان)</label>
<input id="amount" type="text" inputmode="numeric" value="0">
<label>مبلغ بیعانه (تومان)</label>
<input id="deposit" type="text" inputmode="numeric" value="0">
<label>توضیحات</label>
<textarea id="notes" rows="3" placeholder="توضیحات رزرو..."></textarea>
<button type="submit">ثبت رزرو</button>
<div id="bookingMessage"></div>
</form>
</div>
</div>

<div id="list" class="hidden">
<div class="card">
<h2>فهرست رزروها</h2>
<div id="reservationList"></div>
</div>
</div>
</section>
</main>
<div id="jalaliPicker" class="jalali-overlay hidden"
 onclick="if(event.target===this)closeJalaliPicker()">

 <div class="jalali-modal">

  <div class="jalali-title">انتخاب تاریخ شمسی</div>

  <div class="jalali-wheels">

   <div class="wheel-wrap">
    <small>روز</small>
    <div id="dayWheel" class="wheel"></div>
   </div>

   <div class="wheel-wrap">
    <small>ماه</small>
    <div id="monthWheel" class="wheel"></div>
   </div>

   <div class="wheel-wrap">
    <small>سال</small>
    <div id="yearWheel" class="wheel"></div>
   </div>

  </div>

  <div id="pickerError"></div>

  <div class="picker-actions">
   <button class="secondary"
    onclick="closeJalaliPicker()">انصراف</button>

   <button onclick="confirmJalaliPicker()">تأیید تاریخ</button>
  </div>

 </div>
</div>
<script>
const SUPABASE_URL = "https://bvvnykswdkbebmghndzt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HsF_nBfxbh3TnxCPUrJqsA_jTzB15lf";

const db = window.supabase.createClient(
SUPABASE_URL, SUPABASE_ANON_KEY
);

let rooms = [];
 
function formatMoney(input) {
  let digits = input.value
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\D/g, '');

  input.value = digits
    ? Number(digits).toLocaleString('en-US')
    : '';
}

document.getElementById('amount')
  .addEventListener('input', e => formatMoney(e.target));

document.getElementById('deposit')
  .addEventListener('input', e => formatMoney(e.target));

async function login(){
 const {error}=await db.auth.signInWithPassword({
 email:document.getElementById('email').value,
 password:document.getElementById('password').value
 });
 document.getElementById('message').textContent=error
 ? error.message : '';
 if(!error) await startApp();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function startApp(){
 document.getElementById('login').classList.add('hidden');
 document.getElementById('dashboard').classList.remove('hidden');
 await loadRooms();
 await loadReservations();
}

function showTab(tab){
 ['home','rooms','booking','list'].forEach(id=>{
 document.getElementById(id).classList.toggle('hidden',id!==tab);
 });
}

async function loadRooms(){
 const {data,error}=await db.from('rooms')
 .select('*').eq('is_active',true)
 .order('display_order');
 if(error){alert(error.message);return;}
 rooms=data||[];

 document.getElementById('roomList').innerHTML=rooms.map(r=>`
 <div class="room">
 <b>${r.name}</b>
 <small>ظرفیت معمول: ${r.capacity} نفر</small><br>
 <small>حداکثر ظرفیت: ${r.max_capacity} نفر</small>
 </div>`).join('');

 document.getElementById('roomSelect').innerHTML=
 '<option value="">انتخاب اتاق</option>'+
 rooms.map(r=>`<option value="${r.id}">${r.name} - ظرفیت ${r.max_capacity} نفر</option>`).join('');
}
function formatJalaliDate(dateString) {
  if (!dateString) return '';

  const [y, m, d] = dateString.split('-').map(Number);
  const date = new Date(y, m - 1, d, 12);

  return new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(date);
}
 // موتور تقویم شمسی بوم‌گردی مهران

const jalaliMonths = [
 'فروردین','اردیبهشت','خرداد',
 'تیر','مرداد','شهریور',
 'مهر','آبان','آذر',
 'دی','بهمن','اسفند'
];

let currentPickerField = null;

let selectedJalali = {
 day:1,
 month:1,
 year:1405
};

function getJalaliParts(date){

 const parts = new Intl.DateTimeFormat(
  'en-US-u-ca-persian',
  {
   year:'numeric',
   month:'numeric',
   day:'numeric'
  }
 ).formatToParts(date);

 const result = {};

 parts.forEach(p=>{
  if(p.type==='year') result.year=Number(p.value);
  if(p.type==='month') result.month=Number(p.value);
  if(p.type==='day') result.day=Number(p.value);
 });

 return result;
}

function jalaliToGregorian(jy,jm,jd){

 const start = new Date(jy+621,2,15,12);

 for(let i=-12;i<=12;i++){

  const date = new Date(start);
  date.setDate(start.getDate()+i);

  const p = getJalaliParts(date);

  if(
   p.year===jy &&
   p.month===jm &&
   p.day===jd
  ){
   return date;
  }
 }

 return null;
}

function renderWheel(id,items,selected,key){

 const wheel=document.getElementById(id);

 wheel.innerHTML=
 '<div class="wheel-spacer"></div>'+

 items.map(item=>`
  <button type="button"
   class="wheel-item ${item.value===selected?'active':''}"
   onclick="this.parentElement.scrollTo({top:${items.indexOf(item)}*44,behavior:'smooth'})">
   ${item.label}
  </button>
 `).join('')+

 '<div class="wheel-spacer"></div>';

 wheel.onscroll=()=>{

  const index=Math.max(0,Math.min(
   items.length-1,
   Math.round(wheel.scrollTop/44)
  ));

  selectedJalali[key]=items[index].value;

  wheel.querySelectorAll('.wheel-item')
   .forEach((item,i)=>{
    item.classList.toggle('active',i===index);
   });
 };

 wheel.scrollTop=items.findIndex(
  item=>item.value===selected
 )*44;
}

function openJalaliPicker(field){

 currentPickerField=field;

 const hidden=document.getElementById(field);

 let date=hidden.value
  ? new Date(hidden.value+'T12:00:00')
  : new Date();

 let p=getJalaliParts(date);

 if(p.year<1405 || p.year>1600){
  p={day:1,month:1,year:1405};
 }

 selectedJalali={
  day:p.day,
  month:p.month,
  year:p.year
 };

 renderWheel(
  'dayWheel',
  Array.from({length:31},(_,i)=>({
   value:i+1,
   label:String(i+1).padStart(2,'0')
  })),
  p.day,
  'day'
 );

 renderWheel(
  'monthWheel',
  jalaliMonths.map((name,i)=>({
   value:i+1,
   label:name
  })),
  p.month,
  'month'
 );

 renderWheel(
  'yearWheel',
  Array.from({length:196},(_,i)=>({
   value:1405+i,
   label:String(1405+i)
  })),
  p.year,
  'year'
 );

 document.getElementById('pickerError').textContent='';

 document.getElementById('jalaliPicker')
  .classList.remove('hidden');
}

function closeJalaliPicker(){

 document.getElementById('jalaliPicker')
  .classList.add('hidden');
}

function confirmJalaliPicker(){

 const {year,month,day}=selectedJalali;

 const date=jalaliToGregorian(year,month,day);

 if(!date){

  document.getElementById('pickerError')
   .textContent='این تاریخ در تقویم شمسی معتبر نیست.';

  return;
 }

 const iso=[
  date.getFullYear(),
  String(date.getMonth()+1).padStart(2,'0'),
  String(date.getDate()).padStart(2,'0')
 ].join('-');

 document.getElementById(currentPickerField).value=iso;

 document.getElementById(
  currentPickerField+'Display'
 ).value=formatJalaliDate(iso);

 closeJalaliPicker();
}
async function loadReservations(){
 const {data,error}=await db.from('reservations')
 .select('*,rooms(name),guests(full_name,phone)')
 .order('created_at',{ascending:false});

 if(error){
 document.getElementById('recent').textContent=error.message;
 return;
 }

 const html=(data||[]).map(r=>`
 <div class="reservation">
 <b>${r.guests?.full_name||'مهمان'}</b>
 <div>${r.rooms?.name||'اتاق'} | ${formatJalaliDate(r.check_in)} تا ${formatJalaliDate(r.check_out)}</div>
 <div class="muted">وضعیت: ${r.status}</div>
 </div>`).join('');

 document.getElementById('total').textContent=(data||[]).length;
 document.getElementById('recent').innerHTML=html||'هنوز رزروی ثبت نشده است.';
 document.getElementById('reservationList').innerHTML=html||'رزروی وجود ندارد.';
}

document.getElementById('bookingForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const msg=document.getElementById('bookingMessage');
 msg.textContent='در حال ثبت رزرو...';

 const room=rooms.find(r=>r.id===document.getElementById('roomSelect').value);
 if(!room){msg.textContent='اتاق را انتخاب کنید.';return;}

 const adults=Number(document.getElementById('adults').value);
 const children=Number(document.getElementById('children').value);
 const infants=Number(document.getElementById('infants').value);
 const totalPeople=adults+children;

 if(totalPeople>room.max_capacity){
 msg.textContent='تعداد مهمانان بیشتر از ظرفیت اتاق است.';
 return;
 }

 const checkIn=document.getElementById('checkin').value;
 const checkOut=document.getElementById('checkout').value;

 if(checkOut<=checkIn){
 msg.textContent='تاریخ خروج باید بعد از تاریخ ورود باشد.';
 return;
 }

 const phone=document.getElementById('phone').value.trim();

 let {data:guest,error}=await db.from('guests')
 .select('id').eq('phone',phone).limit(1).maybeSingle();

 if(error){msg.textContent=error.message;return;}

 if(!guest){
 const result=await db.from('guests').insert({
 full_name:document.getElementById('guestName').value.trim(),
 phone:phone
 }).select('id').single();

 if(result.error){msg.textContent=result.error.message;return;}
 guest=result.data;
 }

 const amount=Number(document.getElementById('amount').value.replace(/,/g,'')) || 0;
const deposit=Number(document.getElementById('deposit').value.replace(/,/g,'')) || 0;
 if(deposit>amount){
 msg.textContent='بیعانه نمی‌تواند از مبلغ کل بیشتر باشد.';
 return;
 }

 const {error:saveError}=await db.from('reservations').insert({
 guest_id:guest.id,
 room_id:room.id,
 check_in:checkIn,
 check_out:checkOut,
 adults,children,infants,
 total_amount:amount,
 deposit_amount:deposit,
 paid_amount:deposit,
 status:'pending',
 notes:document.getElementById('notes').value
 });

 if(saveError){
 msg.textContent='خطا: '+saveError.message;
 return;
 }

 msg.textContent='رزرو با موفقیت ثبت شد.';
 e.target.reset();
 document.getElementById('adults').value=1;
 document.getElementById('amount').value=0;
 document.getElementById('deposit').value=0;
 await loadReservations();
});

db.auth.getSession().then(({data})=>{
 if(data.session) startApp();
});
</script>
</body>
</html>
